[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-shenshu"
version = "1.0.0"
description = "铁板神数 Transformer（Tieban Shenshu）：用 Transformer 学习铁板神数起数映射（四柱+六亲 → 六门条号 → 命书）"
readme = "README.md"
keywords = ["铁板神数", "鐵板神數", "tieban shenshu", "bazi", "chinese metaphysics", "fortune telling", "transformer", "pytorch"]
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Grok Bot" },
  { name = "Opus 5.5" },
]
dependencies = [
  "torch>=2.1",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "numpy>=1.24",
  "safetensors>=0.4",
  "lunar-python>=1.4",
]

[project.optional-dependencies]
train = ["tensorboard>=2.14"]
dev = ["pytest>=7.4"]

[project.scripts]
shenshu = "transformer_shenshu.cli.interactive:main"
shenshu-demo = "transformer_shenshu.cli.demo:main"
shenshu-train = "transformer_shenshu.train.train:main"

[tool.setuptools.packages.find]
where = ["src"]
